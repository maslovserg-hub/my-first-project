<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сергей Маслов — Визитка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a08;--card:#100f0c;
  --p1:#c8a84b;--p2:#f0c060;--p3:#a07830;
  --dim:#8a7d60;--border:rgba(200,168,75,0.12)
}
body{
  background:var(--bg);color:#fff;
  font-family:'Raleway',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;overflow-x:hidden
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 50%,rgba(200,168,75,.09) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 20%,rgba(240,192,96,.07) 0%,transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 90%,rgba(160,120,48,.06) 0%,transparent 70%)
}
.card{
  position:relative;z-index:1;
  background:linear-gradient(160deg,#161410 0%,#100f0c 60%,#130f08 100%);
  border:1px solid rgba(200,168,75,.18);
  border-radius:28px;
  padding:52px 44px 48px;
  max-width:460px;width:100%;
  text-align:center;
  box-shadow:0 0 0 1px rgba(200,168,75,.07),0 24px 64px rgba(0,0,0,.7),0 0 80px rgba(200,168,75,.04);
  animation:fadeUp .7s cubic-bezier(.16,1,.3,1)
}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

/* ── Avatar ── */
.avatar{
  width:96px;height:96px;border-radius:50%;margin:0 auto 28px;
  position:relative;display:flex;align-items:center;justify-content:center
}
.avatar img{
  width:96px;height:96px;border-radius:50%;
  object-fit:cover;object-position:center top;
  position:relative;z-index:1;
  display:block
}
.avatar::before{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  background:linear-gradient(135deg,var(--p3),var(--p1),var(--p2));
  z-index:0
}
.avatar::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  background:linear-gradient(135deg,var(--p1),var(--p2),var(--p3));
  z-index:-1;filter:blur(14px);opacity:.55;
  animation:avatarGlow 3s ease-in-out infinite alternate
}
@keyframes avatarGlow{from{opacity:.4;filter:blur(10px)}to{opacity:.65;filter:blur(22px)}}

/* ── Name ── */
.name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(34px,8vw,54px);font-weight:700;letter-spacing:1px;
  position:relative;display:block;
  filter:drop-shadow(0 0 18px rgba(200,168,75,.5));
  animation:nameGlow 3s ease-in-out infinite alternate;
  margin-bottom:14px;cursor:default
}
/* базовый золотой слой — всегда виден */
.name-base{
  background:linear-gradient(90deg,#a07830 0%,#c8a84b 20%,#f0c060 50%,#c8a84b 80%,#a07830 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:block
}
/* слой сияния — следует за курсором, появляется через opacity */
.name-shine{
  position:absolute;inset:0;
  background:linear-gradient(90deg,
    #a07830  0%,  #c8a84b  8%,  #f0c060 18%,
    #c8a84b 26%,  #a07830 33%,  #9a7228 36%,
    #b89040 40%,  #d4ae58 44%,  #f5e0a0 47%,
    #fff8e8 49%,  #ffffff 50%,  #fff8e8 51%,
    #f5e0a0 53%,  #d4ae58 56%,  #b89040 60%,
    #9a7228 64%,  #a07830 67%,  #c8a84b 75%,
    #f0c060 83%,  #c8a84b 91%,  #a07830 100%
  );
  background-size:300% 100%;
  background-position:50% center;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  opacity:0;
  transition:opacity 0.7s ease;
  pointer-events:none;
  font-family:inherit;font-size:inherit;font-weight:inherit;
  letter-spacing:inherit;line-height:inherit;
  white-space:nowrap
}
@keyframes nameGlow{
  from{filter:drop-shadow(0 0 10px rgba(200,168,75,.4))}
  to{filter:drop-shadow(0 0 28px rgba(240,192,96,.75))}
}

/* ── Role ── */
.role{color:rgba(200,168,75,.7);font-size:14px;font-weight:300;letter-spacing:1.8px;line-height:1.85;margin-bottom:28px;max-width:320px;margin-left:auto;margin-right:auto;text-transform:uppercase;font-family:'Raleway',sans-serif}

/* ── Tags ── */
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px}
.tag{
  background:rgba(200,168,75,.08);border:1px solid rgba(200,168,75,.22);
  color:#c8a84b;padding:4px 14px;border-radius:20px;font-size:10.5px;font-weight:600;
  letter-spacing:1.2px;text-transform:uppercase;transition:background .2s,border-color .2s
}
.tag:hover{background:rgba(200,168,75,.18);border-color:rgba(200,168,75,.45)}

/* ── Divider ── */
.div{height:1px;background:linear-gradient(90deg,transparent,rgba(200,168,75,.35),transparent);margin:28px 0}

/* ── QR ── */
.qr-label{font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:2.5px;margin-bottom:12px}
.qr-wrap{
  display:inline-block;padding:14px;background:#fdf8ee;border-radius:16px;
  box-shadow:0 0 40px rgba(200,168,75,.2),0 0 0 1px rgba(200,168,75,.2);
  transition:box-shadow .3s,transform .3s
}
.qr-wrap:hover{box-shadow:0 0 60px rgba(240,192,96,.35),0 0 0 1px rgba(240,192,96,.4);transform:scale(1.02)}
#qr canvas{display:block}


/* ── CTA ── */
.cta{
  display:inline-flex;align-items:center;gap:9px;
  background:linear-gradient(135deg,#a07830,#c8a84b,#f0c060,#c8a84b);
  background-size:200% 100%;
  color:#0a0800;text-decoration:none;
  padding:14px 36px;border-radius:50px;
  font-family:'Raleway',sans-serif;
  font-size:13.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  position:relative;overflow:hidden;
  box-shadow:0 4px 24px rgba(200,168,75,.35),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .2s,box-shadow .2s,background-position .4s
}
.cta::before{
  content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:linear-gradient(135deg,#c8a84b,#f0c060,#ffd97a)
}
.cta svg,.cta span{position:relative;z-index:1}
.cta svg{width:17px;height:17px;flex-shrink:0}
.cta:hover::before{opacity:1}
.cta:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 32px rgba(200,168,75,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.cta:active{transform:translateY(0) scale(.98)}
.cta-label{font-size:9.5px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:3.5px;margin-bottom:16px;margin-top:16px}
.cta-row{display:flex;gap:14px;justify-content:center;width:100%}
.cta-wrap{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:stretch}
.cta{width:100%;justify-content:center}
.cta-qr-popup{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(6px);
  width:max-content;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:rgba(16,15,12,.97);border:1px solid rgba(200,168,75,.3);border-radius:16px;
  padding:14px 14px 10px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
  z-index:10
}
/* прозрачный мост через зазор — hover не теряется */
.cta-qr-popup::before{
  content:'';position:absolute;top:100%;left:0;width:100%;height:16px;
}
.cta-qr-popup::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:rgba(200,168,75,.3);
  pointer-events:none
}
/* одинаковый размер QR: оба канваса масштабируются до 164px */
.cta-qr-popup canvas{
  width:164px!important;height:164px!important;
  image-rendering:pixelated;image-rendering:crisp-edges;
  display:block
}
.qr-link{display:block;text-decoration:none}
.qr-sub{font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin:0}
.cta-wrap:hover .cta-qr-popup,.cta-qr-popup:hover{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.cta::after{
  content:'';position:absolute;inset:-2px;border-radius:50px;
  background:linear-gradient(135deg,#c8a84b,#f0c060);
  z-index:-1;opacity:0;animation:pulse 2.2s ease-out infinite
}
@keyframes pulse{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}


@media(max-width:480px){
  .card{padding:40px 24px 36px;border-radius:22px}
}
</style>

<script>

// Adapted from qrcode-generator by Kazuhiko Arase (MIT License)
(function(){

// ── Reed-Solomon ──
var RS=function(deg){
  this.d=[];
  for(var i=0;i<deg-1;i++)this.d[i]=0;
  this.d[deg-1]=1;
};
RS.prototype.get=function(i){return this.d[i]};
RS.prototype.len=function(){return this.d.length};
var GF_EXP=new Array(512),GF_LOG=new Array(256);
(function(){
  var x=1;
  for(var i=0;i<256;i++){
    GF_EXP[i]=x;GF_LOG[x]=i;
    x<<=1;if(x&0x100)x^=0x11d;
  }

function genPoly(ec){
  var p=[1];
  for(var i=0;i<ec;i++){
    var q=[1,GF_EXP[i]];
    var r=[];
    for(var j=0;j<p.length+q.length-1;j++)r[j]=0;
    for(var j=0;j<p.length;j++)for(var k=0;k<q.length;k++)r[j+k]^=gfMul(p[j],q[k]);
    p=r;
  }

}
function polyMod(msg,gen){
  var out=msg.slice();
  for(var i=0;i<msg.length;i++){
    var c=out[i];

  }

// We'll auto-pick version based on data length

  // version: [modules, ec_codewords_per_block, blocks, data_codewords]
  {s:21,ec:7,bl:1,dc:16},   // 1
  {s:25,ec:10,bl:1,dc:28},  // 2
  {s:29,ec:15,bl:1,dc:44},  // 3
  {s:33,ec:20,bl:2,dc:32},  // 4  (2 blocks x 32 = 64 data, 2x20 ec = 40 ec)
  {s:37,ec:26,bl:2,dc:43},  // 5
  {s:41,ec:18,bl:4,dc:27},  // 6
  {s:45,ec:20,bl:4,dc:31},  // 7
];

// Simplified: known capacity table [version][ECC M] = max bytes
var CAPACITY_M=[0,14,26,44,64,86,108,124];

function pickVersion(len){

function setAlignPattern(m,r,c){
  for(var i=-2;i<=2;i++)for(var j=-2;j<=2;j++){

var ALIGN_POS=[
  [],     // 1
  [6,18], // 2
  [6,22], // 3
  [6,26], // 4
  [6,30], // 5
  [6,34], // 6
  [6,22,38], // 7 - actually version 7 has more but let's simplify

function buildQR(text){

  var utf8=[];

  var ver=pickVersion(dataLen);

  var ecPerBlock=VERSION_DATA[ver].ec;
  var numBlocks=VERSION_DATA[ver].bl;
  var dcPerBlock=VERSION_DATA[ver].dc;

  // Build data codewords
  var bits=[];
  function pushBits(val,n){for(var i=n-1;i>=0;i--)bits.push((val>>i)&1);}
  pushBits(0b0100,4); // byte mode

  pushBits(dataLen,8);
  for(var i=0;i<utf8.length;i++)pushBits(utf8[i],8);
  pushBits(0,4); // terminator
  while(bits.length%8!==0)bits.push(0);
  var totalDC=dcPerBlock*numBlocks;
  var bytes=[];
  for(var i=0;i<bits.length;i+=8)bytes.push(parseInt(bits.slice(i,i+8).join(''),2));

    var blk=bytes.slice(b*dcPerBlock,(b+1)*dcPerBlock);
    var ec=polyMod(blk,gen);
    allEC.push(ec);
  }

  // Interleave data
  var interleaved=[];
  for(var i=0;i<dcPerBlock;i++)for(var b=0;b<numBlocks;b++)interleaved.push(bytes[b*dcPerBlock+i]);
  for(var i=0;i<ecPerBlock;i++)for(var b=0;b<numBlocks;b++)interleaved.push(allEC[b][i]);

  // Build bit stream
  var dataStream=[];
  for(var i=0;i<interleaved.length;i++)for(var j=7;j>=0;j--)dataStream.push((interleaved[i]>>j)&1);
  // remainder bits
  var rem=[0,7,7,7,7,7,0];
  for(var i=0;i<rem[ver];i++)dataStream.push(0);

  // ── Build matrix ──
  var m=makeBitMatrix(size);
  var reserved=makeBitMatrix(size); // 1=function,2=format

  // Finder patterns
  setFinder(m,0,0);setFinder(m,0,size-7);setFinder(m,size-7,0);
  // Separators
  for(var i=0;i<8;i++){
    [0,size-8].forEach(function(c){if(c<size){m[7][c+i]=0;m[i][c+7<size?c+7:size-1-i]=0;}});
  }
  // Reserve finder + separators
  for(var r=0;r<9;r++)for(var c=0;c<9;c++){reserved[r][c]=1;}
  for(var r=0;r<9;r++)for(var c=size-8;c<size;c++){reserved[r][c]=1;}
  for(var r=size-8;r<size;r++)for(var c=0;c<9;c++){reserved[r][c]=1;}

  // Timing
  setTiming(m,size);
  for(var i=8;i<size-8;i++){reserved[6][i]=1;reserved[i][6]=1;}

  // Alignment (ver>=2)
  var ap=ALIGN_POS[ver];
  if(ap.length>=2){
    for(var ai=0;ai<ap.length;ai++)for(var aj=0;aj<ap.length;aj++){
      var r=ap[ai],c=ap[aj];
      if(!reserved[r][c]){setAlignPattern(m,r,c);for(var di=-2;di<=2;di++)for(var dj=-2;dj<=2;dj++)reserved[r+di][c+dj]=1;}
    }
  }

  // Dark module
  m[size-8][8]=1;reserved[size-8][8]=1;

  // Format info placeholder (reserve)
  for(var i=0;i<9;i++){
    if(i!==6){reserved[i][8]=1;reserved[8][i]=1;}
  }
  for(var i=0;i<8;i++){
    reserved[size-1-i][8]=1;reserved[8][size-8+i]=1;
  }

  // ── Place data ──
  var maskFn=function(r,c){return(r+c)%2===0}; // mask pattern 0
  var bi=0;
  var up=true;
  for(var col=size-1;col>=0;col-=2){
    if(col===6)col--;

    }

  }

  // ── Format info ──
  var fi=FORMAT_M[0]; // mask 0
  // Place around top-left finder
  var fmts=[];
  for(var i=0;i<15;i++)fmts.push((fi>>(14-i))&1);
  var fi_pos=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];

  for(var i=0;i<8;i++){m[8][size-1-i]=fmts[i];}

  for(var i=0;i<7;i++){m[size-7+i][8]=fmts[8+i];}

}

function renderQR(containerId,text,pixelSize){
  pixelSize=pixelSize||5;
  var result=buildQR(text);
  var size=result.size;
  var matrix=result.matrix;
  var canvas=document.createElement('canvas');
  var quiet=4;
  var total=(size+quiet*2)*pixelSize;
  canvas.width=canvas.height=total;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,total,total);
  ctx.fillStyle='#000000';
  for(var r=0;r<size;r++){
    for(var c=0;c<size;c++){
      if(matrix[r][c]){
        ctx.fillRect((c+quiet)*pixelSize,(r+quiet)*pixelSize,pixelSize,pixelSize);
      }
    }
  }
  document.getElementById(containerId).appendChild(canvas);
}

<script>
(function(){
  var name  = document.querySelector('.name');
  var shine = document.querySelector('.name-shine');

  name.addEventListener('mouseenter', function(e){
    // Позиция — мгновенно под курсор (без transition на background-position)
    var rect  = this.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    shine.style.backgroundPosition = (75 - ratio * 50) + '% center';
    // Свет плавно появляется
    shine.style.transition = 'opacity 0.6s ease';
    shine.style.opacity = '1';
  });

  name.addEventListener('mousemove', function(e){
    // Позиция следует за курсором мгновенно — без transition
    var rect  = this.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    shine.style.transition = 'opacity 0.6s ease'; // только opacity переходит
    shine.style.backgroundPosition = (75 - ratio * 50) + '% center';
  });

  name.addEventListener('mouseleave', function(){
    shine.style.transition = 'opacity 0.8s ease';
    shine.style.opacity = '0';
  });

  // Touch: краткая вспышка под пальцем, затем гаснет
  name.addEventListener('touchstart', function(e){
    var touch = e.touches[0];
    var rect  = this.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
    shine.style.transition = 'none';
    shine.style.backgroundPosition = (75 - ratio * 50) + '% center';
    shine.style.transition = 'opacity 0.4s ease';
    shine.style.opacity = '1';
  }, {passive: true});

  name.addEventListener('touchend', function(){
    shine.style.transition = 'opacity 0.9s ease';
    shine.style.opacity = '0';
  }, {passive: true});
})();
</script>

<script>
// ── Мобильный: первое касание → QR, второе → переход по ссылке ──
(function(){
  var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (!isTouchDevice) return;

  // Скрыть все попапы
  function hideAll(){
    document.querySelectorAll('.cta-qr-popup').forEach(function(p){
      p.style.opacity = '0';
      p.style.transform = 'translateX(-50%) translateY(6px)';
      p.style.pointerEvents = 'none';
    });
  }

  document.querySelectorAll('.cta-wrap').forEach(function(wrap){
    var popup  = wrap.querySelector('.cta-qr-popup');
    var link   = wrap.querySelector('.cta');

    link.addEventListener('click', function(e){
      var isVisible = popup.style.opacity === '1';
      if (!isVisible) {
        // Первое нажатие — показать QR, не переходить
        e.preventDefault();
        hideAll();
        popup.style.opacity = '1';
        popup.style.transform = 'translateX(-50%) translateY(0)';
        popup.style.pointerEvents = 'auto';
      }
      // Второе нажатие — popup уже виден, переход разрешён (e.preventDefault не вызывается)
    });
  });

  // Нажатие вне кнопок — скрыть попапы
  document.addEventListener('click', function(e){
    if (!e.target.closest('.cta-wrap')) hideAll();
  });
})();
</script>
